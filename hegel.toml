# Hegel property-based testing settings. See `hegel::docs::settings`.
#
# 256 cases is what the suite ran at before the hegel migration, so the
# move did not quietly reduce coverage. Individual tests that are
# expensive (subprocess round-trips against bcftools, htslib or noodles)
# lower it with `#[hegel::test(test_cases = N)]`.
#
# For a deeper run, either `HEGEL_DEFAULT_PROFILE=thorough cargo nextest run`
# or `HEGEL_TEST_CASES=10000 cargo nextest run` (the latter overrides the
# per-test counts too).

[profiles.development]
test_cases = 256

[profiles.ci]
test_cases = 256

[profiles.thorough]
test_cases = 10000
