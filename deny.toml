# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`. CI: .github/workflows/audit.yml

[graph]
all-features = true

[advisories]
ignore = [
    # custom_derive is unmaintained. Only rust-htslib pulls it in, and
    # rust-htslib is a dev-dependency (test oracle) plus the optional
    # `hts-compat` feature of seqair-types. Nothing we can swap out.
    { id = "RUSTSEC-2025-0058", reason = "via rust-htslib only (dev-dep / optional hts-compat)" },
    # rust-bio is compair's benchmark baseline, a dev-dependency only.
    { id = "RUSTSEC-2025-0057", reason = "fxhash via bio, compair dev-dep (benchmark) only" },
    { id = "RUSTSEC-2024-0436", reason = "paste via bio -> statrs -> nalgebra, compair dev-dep (benchmark) only" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "NCSA", # libfuzzer-sys (fuzz crate only)
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9
# The fuzz crate is `publish = false` and has no license field.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path deps within the workspace have no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# gkl-rs is compair's benchmark target, pinned to a rev (see its Cargo.toml).
allow-git = ["https://github.com/philipc/gkl-rs"]
