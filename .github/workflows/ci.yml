name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check
        working-directory: fuzz

  shear:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      - run: cargo shear --locked
      - run: cargo shear --locked fuzz

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Broken intra-doc links are silent otherwise: rustdoc reports them as
      # warnings, and a wall of them hides the next real one. `--examples`
      # covers the example crates, whose module docs are the crate's tutorial.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features --examples

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install htslib build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            zlib1g-dev libbz2-dev liblzma-dev \
            libssl-dev libcurl4-openssl-dev \
            samtools tabix bcftools
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: Test
        id: test
        continue-on-error: true
        run: cargo nextest run --locked --workspace --profile ci
      # nextest does not run doctests.
      - name: Doctests
        id: doctest
        continue-on-error: true
        run: cargo test --locked --workspace --doc
      - name: Fuzz compiles
        id: fuzz
        continue-on-error: true
        working-directory: fuzz
        run: cargo check --locked
      # Every other step runs `--all-features`, so nothing would compile the
      # serde-off path: `r[pos.serde_optional]` requires it to keep working,
      # and the next forgotten `#[cfg(feature = "serde")]` would ship green.
      - name: Default features off
        id: nodefault
        continue-on-error: true
        run: |
          cargo check --locked -p seqair-types --no-default-features --all-targets
          cargo check --locked -p seqair --no-default-features --all-targets
      # `continue-on-error` above is only there to let every step report before
      # the job stops, so each one must be named here. The fuzz step was not,
      # and five targets went unbuildable for several API changes without a
      # single red run.
      - name: Fail if clippy, tests, doctests, the fuzz targets or the no-default build failed
        if: >-
          steps.clippy.outcome == 'failure'
          || steps.test.outcome == 'failure'
          || steps.doctest.outcome == 'failure'
          || steps.fuzz.outcome == 'failure'
          || steps.nodefault.outcome == 'failure'
        run: exit 1
