[package]
name = "compair"
version = "0.1.0"
edition = "2024"
description = "Banded affine-gap pair-HMM with a pluggable, conversion-aware emission model"
repository = "https://github.com/Softleif/seqair"
rust-version = "1.98.1"
authors = ["Pascal Hertleif <pascal@softleif.se>"]
license = "MIT OR Apache-2.0"
exclude = ["fuzz/*", "tests/*", "benches/*"]

[dependencies]
seqair-types = { version = "^0.3.1", path = "../seqair-types" }
thiserror = { workspace = true }
fearless_simd = "1.0"
fearless_simd_macros = "0.1"
# The `gpu` feature: the banded pair-HMM as a wgpu compute shader. The versions
# are rastair's (biosphere's GPU inference), so the two share one device stack.
wgpu = { version = "30", optional = true }
bytemuck = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
tracing = { workspace = true, optional = true }

[features]
# One thread per (read, haplotype) pair on a GPU through wgpu (Metal, Vulkan,
# DX12). A separate kernel with its own oracle; see `compair::gpu`.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:tracing"]

# Benchmark only. gkl's `c-avx`/`c-avx512` features do not *add* the original
# Intel C++ kernels beside the Rust ports -- they **replace** them, because
# `forward_f32x8` and friends are one `cfg_if` over the same name and gkl's Rust
# AVX module is `#[cfg(not(feature = "c-avx"))]`. So the two cannot coexist in
# one binary, and comparing them means two runs of the same bench over the same
# vendored C++ source:
#
#     cargo bench -p compair --bench tenspeed                     # Rust ports
#     cargo bench -p compair --bench tenspeed --features gkl-cpp  # Intel C++
#
# The arms rename themselves to `gkl-rust/...` or `gkl-cpp/...` so the two runs
# do not overwrite each other's criterion baselines.
gkl-cpp = ["gkl/c-avx", "gkl/c-avx512"]

[dev-dependencies]
# Compiles fearless_simd's scalar `Fallback` level on SIMD targets too, so the
# parity tests can run it next to every vector level the CPU has.
fearless_simd = { version = "1.0", features = ["force_support_fallback"] }
proptest = "1.11.0"
criterion = "0.8.2"
bio = { version = "4.0.1", default-features = false }

# The benchmark target: a Rust port of the kernel GATK actually calls through
# JNI. Pinned to git rather than crates.io because 0.1.1 is FFI-only to the C++
# AVX build and has no scalar arm, while the repository HEAD reimplements the
# kernels in Rust (`forward_f32x8`, `f64x4`, `f32x1`, `f64x1`) with the C++ kept
# behind an off-by-default feature. Rust-vs-Rust is the comparison worth having:
# same compiler, same codegen, no C++ toolchain variance in the middle of it.
#
# Its `build.rs` compiles x86 C++ unconditionally, so it can only be a
# dependency where that compiles; on aarch64 the gkl arms cfg out.
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
gkl = { git = "https://github.com/philipc/gkl-rs", rev = "9eec44205839fc9e77a4acbe3740e0dab92254af" }

[[bench]]
name = "align"
harness = false

[[bench]]
name = "rust_bio"
harness = false

[[bench]]
name = "tenspeed"
harness = false

[[example]]
name = "gpu_tenspeed"
required-features = ["gpu"]

[[example]]
name = "gpu_widths"
required-features = ["gpu"]

[[example]]
name = "gpu_flush"
required-features = ["gpu"]

[[example]]
name = "gpu_shadow"
required-features = ["gpu"]
