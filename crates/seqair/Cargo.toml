[package]
name = "seqair"
version = "0.8.0"
edition = "2024"
description = "Pure-Rust BAM/SAM/CRAM/FASTA reader and pileup engine"
repository = "https://github.com/Softleif/seqair"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"
readme = "../../README.md"
exclude = ["tests/*", "benches/*"]

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[package.metadata.cargo-shear]
# Only ever included through `#[path]` from a bench, an example and a unit test,
# which cargo-shear does not follow.
ignored-paths = ["tests/support/cram_raw_blocks.rs"]

[features]
# Forwards `seqair-types/serde`; seqair itself serializes nothing.
serde = ["seqair-types/serde"]
fuzz = ["dep:bzip2"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
bytemuck = { workspace = true }
indexmap = "2"
itoa = "1"
libdeflater = "1.26.1"
# `BgzfStream` inflates on a rayon pool, its own or one shared with the caller.
rayon-core = "1.13"
seqair-types = { version = "^0.4.0", path = "../seqair-types", default-features = false }
rustc-hash = "2.1.3"
# `HashTable`: a hash table whose equality lives outside the stored value —
# mate linking stores record indices and compares the qnames they point into.
hashbrown = "0.17.1"
flate2 = "1.1.10"
bz2ngrs = "0.1.0"
bzip2 = { version = "0.6.1", optional = true }
xz2 = "0.1.7"
md5 = "0.8.1"
fearless_simd = { workspace = true }
fearless_simd_macros = { workspace = true }

[dev-dependencies]
# Compiles fearless_simd's scalar `Fallback` level on SIMD targets too, so the
# kernel tests can run it next to every vector level the CPU has.
fearless_simd = { workspace = true, features = ["force_support_fallback"] }
hegeltest = { workspace = true }
# Makes bzip2 test inputs and is the oracle for the reference decoder.
bzip2 = "0.6.1"
tempfile = "3.27.0"
libc = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }

# to compare with:
bgzf = "0.5.0"
rust-htslib = { workspace = true, default-features = false, features = [
    "libdeflate",
    "bzip2",
    "lzma",
    "static",
] }
noodles = { version = "0.118.0", features = [
    "bam",
    "bcf",
    "bgzf",
    "core",
    "cram",
    "fasta",
    "fastq",
    "sam",
    "vcf",
] }
needletail = { version = "0.7", default-features = false, features = [
    "flate2",
] }
seq_io = "0.3.4"
noodles-bgzf = { version = "0.52.0", features = ["libdeflate"] }
noodles-util = { version = "0.87.0", features = ["alignment"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

[[bench]]
name = "bam"
harness = false

[[bench]]
name = "fasta"
harness = false

[[bench]]
name = "stream"
harness = false

[[bench]]
name = "fastq"
harness = false

[[bench]]
name = "vcf"
harness = false

[[bench]]
name = "cram"
harness = false

[[bench]]
name = "simd_kernels"
harness = false

[[bench]]
name = "fqzcomp"
harness = false

[lints]
workspace = true
